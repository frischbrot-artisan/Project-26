name: HEX-Dateien bauen
# Baut alle Firmwares und stellt jede HEX-Datei einzeln (nicht gezippt) unter "Artifacts" bereit.
# Wird ein Release veroeffentlicht, haengt der Lauf alle HEX-Dateien automatisch an dieses Release an.
on:
  push:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  hex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: AVR-Toolchain installieren
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr make unzip
      - name: Firmware bauen
        run: sh ./build_hex.sh
      - name: LWCloneU2_Resurrected_DUO_Rev0.4b.hex
        uses: actions/upload-artifact@v7
        with:
          path: hex/LWCloneU2_Resurrected_DUO_Rev0.4b.hex
          archive: false
      - name: LWCloneU2_Resurrected_SLIM_Rev0.4b.hex
        uses: actions/upload-artifact@v7
        with:
          path: hex/LWCloneU2_Resurrected_SLIM_Rev0.4b.hex
          archive: false
      - name: LWCloneU2_Resurrected_FORCE_Rev0.4b.hex
        uses: actions/upload-artifact@v7
        with:
          path: hex/LWCloneU2_Resurrected_FORCE_Rev0.4b.hex
          archive: false
      - name: LWCloneU2_Resurrected_VERSUS_Rev0.4b.hex
        uses: actions/upload-artifact@v7
        with:
          path: hex/LWCloneU2_Resurrected_VERSUS_Rev0.4b.hex
          archive: false
      - name: LWCloneU2_Resurrected_VPINBALL_Rev0.9c_ATmega2560.hex
        uses: actions/upload-artifact@v7
        with:
          path: hex/LWCloneU2_Resurrected_VPINBALL_Rev0.9c_ATmega2560.hex
          archive: false
      - name: LWCloneU2_Resurrected_VPINBALL_Rev0.9c_ATmega16U2.hex
        uses: actions/upload-artifact@v7
        with:
          path: hex/LWCloneU2_Resurrected_VPINBALL_Rev0.9c_ATmega16U2.hex
          archive: false
      - name: LWCloneU2_Resurrected_ARCADE_Rev0.4b_ATmega2560.hex
        uses: actions/upload-artifact@v7
        with:
          path: hex/LWCloneU2_Resurrected_ARCADE_Rev0.4b_ATmega2560.hex
          archive: false
      - name: LWCloneU2_Resurrected_ARCADE_Rev0.4b_ATmega16U2.hex
        uses: actions/upload-artifact@v7
        with:
          path: hex/LWCloneU2_Resurrected_ARCADE_Rev0.4b_ATmega16U2.hex
          archive: false
      - name: HEX-Dateien an das Release anhaengen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" hex/*.hex --clobber --repo "${{ github.repository }}"
